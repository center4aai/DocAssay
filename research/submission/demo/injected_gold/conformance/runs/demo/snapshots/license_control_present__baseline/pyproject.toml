[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
license = "MIT"
name = "quillpad"
version = "0.1.0"
description = "A small local note-taking library with a CLI, a tiny HTTP route table, and a YAML-backed store."
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "click>=8.1",
    "fastapi>=0.110",
    "pydantic>=2.6"
]

[tool.setuptools]
packages = ["quillpad"]
