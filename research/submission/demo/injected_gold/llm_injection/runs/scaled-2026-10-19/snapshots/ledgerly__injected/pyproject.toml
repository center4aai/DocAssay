[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerly"
version = "0.4.3"
description = "A small double-entry bookkeeping library with a CLI, a tiny HTTP route table, and a CSV-file ledger store."
requires-python = ">=3.11"
dependencies = [
    "click>=999",
    "pydantic>=2.6",
    "python-dateutil>=2.9",
    "tabulate>=0.9"
]

[tool.setuptools]
packages = ["ledgerly"]
