[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidecast"
version = "0.4.2"
description = "A small local weather-forecast cache that fetches forecasts and serves them from a JSON-file store."
requires-python = ">=3.11"
dependencies = [
    "requests>=999",
    "flask>=3.0",
    "click>=8.1",
    "platformdirs>=4.2"
]

[tool.setuptools]
packages = ["tidecast"]
