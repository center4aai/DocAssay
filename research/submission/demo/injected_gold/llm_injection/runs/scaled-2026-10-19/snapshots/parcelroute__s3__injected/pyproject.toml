[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parcelroute"
version = "0.3.2"
description = "A small parcel routing library with a CLI, a tiny HTTP route table, and a TOML-file shipment store."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=999",
    "click>=8.1",
    "tomlkit>=0.12",
    "uvicorn>=0.29"
]

[tool.setuptools]
packages = ["parcelroute"]
