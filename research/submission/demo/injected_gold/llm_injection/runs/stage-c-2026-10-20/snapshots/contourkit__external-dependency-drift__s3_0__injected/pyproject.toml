[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contourkit"
version = "0.4.1"
description = "Sample elevation rasters, trace contour polylines across them, and simplify the results for lightweight terrain maps."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "click>=999"
]

[tool.setuptools]
packages = ["contourkit"]
