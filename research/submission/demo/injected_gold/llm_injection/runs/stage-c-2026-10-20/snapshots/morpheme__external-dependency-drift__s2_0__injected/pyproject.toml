[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morpheme"
version = "0.4.2"
description = "Morphological segmentation and lemma lookup for a small language pack."
requires-python = ">=3.11"
dependencies = [
    "regex>=2024.5",
    "pyyaml>=999"
]

[tool.setuptools]
packages = ["morpheme"]
