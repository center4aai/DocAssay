[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sensorbus"
version = "0.4.1"
description = "Collect readings from lab instruments into a shared bus, calibrate them against stored curves, and convert them to requested units."
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24",
    "pint>=0.23"
]

[tool.setuptools]
packages = ["sensorbus"]
