[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetmusic"
version = "0.3.0"
description = "A small library for parsing chord symbols, representing chord progressions, and transposing them between keys."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1"
]

[tool.setuptools]
packages = ["sheetmusic"]
